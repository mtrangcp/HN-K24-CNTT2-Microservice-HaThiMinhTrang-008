spring:
  cloud:
    gateway:
      routes:
        - id: organizer-service
          uri: lb://organizer-service
          predicates:
            - Path=/api/organizer, /api/organizers/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/event, /api/events/**
      server:
        webflux:
          routes:
            - id: organizer-service
              uri: lb://organizer-service
              predicates:
                - Path=/api/organizer, /api/organizers/**
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/event, /api/events/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
